<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch</title>
    <style>
        table{
            width: 80vw;
            border-collapse:collapse;
            margin: auto;
        }
    </style>
    <script>
        const URL="https://dummyjson.com/product?limit=10&skip=6";
        async function loadProducts(){
            try{
                const res=await fetch(URL);
                console.log("res=",res);
                const data=await res.json();
                console.log("data=",data.products);
                let rows="";
                data.products.map((i,index)=>{
                    rows+=`<tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src=${i.images[0]} width=50 height=50/></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td>${i.price}</td>
                        <td>${i.stock}</td>
                    </tr>`;
                });
                document.querySelector("table tbody").innerHTML=rows;
            }
            catch(err){
                console.log("Error:",err);
            }
        }
        loadProducts();
    </script>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Sr.No.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price</th>
                <th>Stock</th>
                
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>

    

</html>
